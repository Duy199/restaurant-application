spring.application.name=RestaurantApplication

server.port=8083

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3308/restaurants_db
spring.datasource.username=root
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

jwt.secret=THIS_IS_A_LONG_RANDOM_SECRET_KEY_32CHARS_MIN
jwt.accessTokenExp=600000
jwt.refreshTokenExp=604800000

spring.jackson.deserialization.fail-on-unknown-properties=true

# Tracing
management.tracing.sampling.probability=1.0
logging.pattern.correlation=[${spring.application.name:},%mdc{traceId:-},%mdc{spanId:-}]

# 30s timeout for shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
